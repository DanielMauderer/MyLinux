<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base colors - will be used throughout -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2025;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111318;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#33353a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#282a2f;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#abc7ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#284677;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <g id="window-frame">
    <rect fill="#111318" rx="10" ry="10"/>
  </g>

  <!-- Titlebar -->
  <g id="titlebar">
    <rect fill="#1e2025"/>
  </g>

  <!-- Buttons -->
  <g id="button-normal">
    <rect fill="url(#buttonGradient)" rx="6" ry="6"/>
  </g>
  
  <g id="button-hover">
    <rect fill="#33353a" rx="6" ry="6"/>
  </g>
  
  <g id="button-pressed">
    <rect fill="#abc7ff" rx="6" ry="6"/>
  </g>

  <!-- Focus indicator -->
  <g id="focus-indicator">
    <rect fill="none" stroke="#abc7ff" stroke-width="2" rx="6" ry="6"/>
  </g>

  <!-- Scrollbar -->
  <g id="scrollbar-groove">
    <rect fill="#1e2025" rx="4" ry="4"/>
  </g>
  
  <g id="scrollbar-slider">
    <rect fill="#44474e" rx="4" ry="4"/>
  </g>
  
  <g id="scrollbar-slider-hover">
    <rect fill="#abc7ff" rx="4" ry="4"/>
  </g>

  <!-- Tab -->
  <g id="tab-active">
    <rect fill="#1e2025" rx="6" ry="6"/>
  </g>
  
  <g id="tab-inactive">
    <rect fill="#111318" rx="6" ry="6"/>
  </g>

  <!-- Menu -->
  <g id="menu-background">
    <rect fill="#1e2025" rx="8" ry="8"/>
  </g>
  
  <g id="menu-item-hover">
    <rect fill="#abc7ff" fill-opacity="0.2" rx="4" ry="4"/>
  </g>

  <!-- Checkbox -->
  <g id="checkbox-unchecked">
    <rect fill="#1e2025" stroke="#44474e" stroke-width="1" rx="4" ry="4"/>
  </g>
  
  <g id="checkbox-checked">
    <rect fill="#abc7ff" rx="4" ry="4"/>
    <path d="M4,8 L7,11 L12,5" stroke="#0c305f" stroke-width="2" fill="none"/>
  </g>

  <!-- Radio button -->
  <g id="radio-unchecked">
    <circle fill="#1e2025" stroke="#44474e" stroke-width="1"/>
  </g>
  
  <g id="radio-checked">
    <circle fill="#abc7ff"/>
    <circle fill="#0c305f" r="4"/>
  </g>

  <!-- Progressbar -->
  <g id="progressbar-groove">
    <rect fill="#1e2025" rx="2" ry="2"/>
  </g>
  
  <g id="progressbar-indicator">
    <rect fill="url(#accentGradient)" rx="2" ry="2"/>
  </g>

  <!-- Slider -->
  <g id="slider-groove">
    <rect fill="#1e2025" rx="2" ry="2"/>
  </g>
  
  <g id="slider-handle">
    <circle fill="#abc7ff"/>
  </g>

  <!-- Tooltip -->
  <g id="tooltip">
    <rect fill="#e2e2e9" rx="6" ry="6"/>
  </g>
</svg>
