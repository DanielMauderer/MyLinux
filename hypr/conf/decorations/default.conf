# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                     Hyprland Decorations Config                           ║
# ║              Window styling with animated gradient borders                ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

decoration {
    # ─────────────────────────────────────────────────────────────────────────
    # Window Rounding
    # ─────────────────────────────────────────────────────────────────────────
    rounding = 12
    
    # ─────────────────────────────────────────────────────────────────────────
    # Opacity
    # ─────────────────────────────────────────────────────────────────────────
    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0
    
    # ─────────────────────────────────────────────────────────────────────────
    # Blur
    # ─────────────────────────────────────────────────────────────────────────
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.2
        special = true
        popups = true
        popups_ignorealpha = 0.2
    }
    
    # ─────────────────────────────────────────────────────────────────────────
    # Shadow
    # ─────────────────────────────────────────────────────────────────────────
    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = rgba(00000055)
        color_inactive = rgba(00000033)
        offset = 0 4
        scale = 1.0
    }
    
    # ─────────────────────────────────────────────────────────────────────────
    # Dim inactive windows
    # ─────────────────────────────────────────────────────────────────────────
    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.3
    dim_around = 0.4
}

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                        Animated Gradient Borders                          ║
# ║              Beautiful animated borders using Material You colors         ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

general {
    # Border thickness
    border_size = 3
    
    # No gaps inside (for cleaner look with borders)
    no_border_on_floating = false
    
    # ─────────────────────────────────────────────────────────────────────────
    # Gradient Borders - Active Window
    # Animated gradient using your matugen colors ($primary, $tertiary, etc.)
    # The 45deg angle rotates with borderangle animation for rainbow effect
    # ─────────────────────────────────────────────────────────────────────────
    col.active_border = $primary $tertiary $secondary $primary 45deg
    
    # ─────────────────────────────────────────────────────────────────────────
    # Gradient Borders - Inactive Window  
    # Subtle gradient for inactive windows
    # ─────────────────────────────────────────────────────────────────────────
    col.inactive_border = $surface_variant $outline_variant 45deg
    
    # Resize border (when resizing)
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    
    # Gaps
    gaps_in = 4
    gaps_out = 8
    gaps_workspaces = 0
    
    # Layout
    layout = dwindle
    
    # Allow tearing (for games)
    allow_tearing = false
}

