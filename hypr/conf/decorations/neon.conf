# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      Hyprland Neon Decorations                            ║
# ║              Vibrant neon glow aesthetic with RGB borders                 ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding = 14
    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0
    
    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.03
        contrast = 1.1
        brightness = 0.9
        vibrancy = 0.4
        vibrancy_darkness = 0.3
    }
    
    shadow {
        enabled = true
        range = 35
        render_power = 4
        color = rgba(00ff8855)
        color_inactive = rgba(00000044)
        offset = 0 6
    }
    
    dim_inactive = true
    dim_strength = 0.15
}

general {
    border_size = 4
    # Neon RGB cycling gradient
    col.active_border = rgb(00ff88) rgb(00aaff) rgb(aa00ff) rgb(ff0088) rgb(00ff88) 45deg
    col.inactive_border = rgb(333355) rgb(224466) 45deg
    gaps_in = 5
    gaps_out = 10
    layout = dwindle
}
