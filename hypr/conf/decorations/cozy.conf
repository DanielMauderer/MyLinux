# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      Hyprland Cozy Decorations                            ║
# ║              Warm, comfortable aesthetic with soft shadows                ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0
    
    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.04
        contrast = 0.95
        brightness = 1.05
        vibrancy = 0.15
        vibrancy_darkness = 0.1
    }
    
    shadow {
        enabled = true
        range = 40
        render_power = 3
        color = rgba(1a1a2e66)
        color_inactive = rgba(00000033)
        offset = 0 8
    }
    
    dim_inactive = true
    dim_strength = 0.12
    dim_special = 0.4
}

general {
    border_size = 3
    # Warm sunset gradient
    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $surface_container_highest $surface_container 45deg
    gaps_in = 6
    gaps_out = 12
    layout = dwindle
}
