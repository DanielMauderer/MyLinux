# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                     Hyprland Minimal Decorations                          ║
# ║              Clean, minimal styling with thin borders                     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
    
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }
    
    shadow {
        enabled = true
        range = 15
        render_power = 2
        color = rgba(00000033)
    }
    
    dim_inactive = false
}

general {
    border_size = 2
    col.active_border = $primary
    col.inactive_border = $outline_variant
    gaps_in = 3
    gaps_out = 6
    layout = dwindle
}
