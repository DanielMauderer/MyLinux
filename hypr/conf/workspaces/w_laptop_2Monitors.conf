# -----------------------------------------------------
# General workspace rules
# name: "Work Laptop - 2 Monitors"
# -----------------------------------------------------

# Map workspaces 1-10 to external monitors (HDMI-A-1 and DP-1)
# Ignoring eDP-1 (internal display)
# Workspaces 1-5 on HDMI-A-1, workspaces 6-10 on DP-1
workspace=1,monitor:DP-5
workspace=2,monitor:DP-5
workspace=3,monitor:DP-5
workspace=4,monitor:DP-5
workspace=5,monitor:DP-5

workspace=6,monitor:DP-6
workspace=7,monitor:DP-6
workspace=8,monitor:DP-6
workspace=9,monitor:DP-6
workspace=10,monitor:DP-6












