# Pavucontrol floating
windowrule {
    name = ml4w-pavucontrol
    match:class = .*org.pulseaudio.pavucontrol.*
    float = true
    size = 700 600
    center = true
    pin = true
}

# SwayNC
layerrule {
    name = ml4w-swaync-cc-blur
    match:namespace = swaync-control-center
    blur = true
    ignore_alpha = 0.5
}

layerrule {
    name = ml4w-swaync-notif-blur
    match:namespace = swaync-notification-window
    blur = true
    ignore_alpha = 0.5
}

# Blueman Manager
windowrule {
    name = ml4w-blueman
    match:class = blueman-manager
    float = true
    size = 800 600
    center = true
}

# nwg-look
windowrule {
    name = ml4w-nwg-look
    match:class = nwg-look
    float = true
    size = 700 600
    move = 10% 20%
    pin = true
}

# nwg-displays
windowrule {
    name = ml4w-nwg-displays
    match:class = nwg-displays
    float = true
    size = 900 600
    move = 10% 20%
    pin = true
}

# System Mission Center
windowrule {
    name = ml4w-missioncenter
    match:class = io.missioncenter.MissionCenter
    float = true
    pin = true
    center = true
    size = 900 600
}

# System Mission Center Preference Window
windowrule {
    name = ml4w-missioncenter-prefs
    match:class = missioncenter
    match:title = ^(Preferences)$
    float = true
    pin = true
    center = true
}

# Gnome Calculator
windowrule {
    name = ml4w-calculator
    match:class = org.gnome.Calculator
    float = true
    size = 700 600
    center = true
}

# Emoji Picker Smile
windowrule {
    name = ml4w-smile
    match:class = it.mijorus.smile
    float = true
    pin = true
    move = monitor_w-window_w-40 90
}

# Hyprland Share Picker
windowrule {
    name = ml4w-share-picker
    match:class = hyprland-share-picker
    float = true
    pin = true
    center = true
    size = 600 400
}

# General floating
windowrule {
    name = ml4w-dotfiles-floating
    match:class = dotfiles-floating
    float = true
    size = 1000 700
    center = true
}

# Floating for Ghostty
windowrule {
    name = ml4w-ghostty-floating
    match:class = ml4w.dotfiles.floating
    float = true
    size = 1000 700
    center = true
    pin = true
}

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
