# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                    Hyprland Smooth Animations                             ║
# ║              Extra smooth, slower animations for relaxed feel             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

animations {
    enabled = true

    # Smooth bezier curves
    bezier = smooth, 0.25, 0.1, 0.25, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = gentle, 0.4, 0, 0.2, 1
    bezier = softBounce, 0.34, 1.56, 0.64, 1

    # Window animations - extra smooth
    animation = windowsIn, 1, 6, softBounce, popin 70%
    animation = windowsOut, 1, 5, smooth, popin 70%
    animation = windowsMove, 1, 5, gentle, slide

    # Fade animations
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = fadeSwitch, 1, 5, smooth
    animation = fadeShadow, 1, 5, smooth
    animation = fadeDim, 1, 6, smooth
    animation = fadeLayers, 1, 5, smooth

    # Border animations
    animation = border, 1, 15, smooth
    animation = borderangle, 1, 150, linear, loop

    # Workspace animations - gentle slide
    animation = workspaces, 1, 7, gentle, slide
    animation = specialWorkspace, 1, 6, gentle, slidefadevert -40%

    # Layers
    animation = layers, 1, 5, smooth, popin 85%
}
