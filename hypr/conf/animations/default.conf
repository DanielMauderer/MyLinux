# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                      Hyprland Animations Config                           ║
# ║              Smooth, premium animations for your desktop                  ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

animations {
    enabled = true
    # ─────────────────────────────────────────────────────────────────────────
    # Bezier Curves - The magic behind smooth animations
    # ─────────────────────────────────────────────────────────────────────────
    
    # Standard Material Design curves
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    
    # Emphasized curves for dramatic effect
    bezier = emphasized, 0.2, 0, 0, 1
    bezier = emphasized_decel, 0.05, 0.9, 0.1, 1
    bezier = emphasized_accel, 0.3, 0, 0.8, 0.15
    
    # Bouncy/Elastic curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = bounce, 0.68, -0.55, 0.265, 1.55
    bezier = elastic, 0.28, 0.84, 0.42, 1
    
    # Smooth/Soft curves
    bezier = smooth, 0.25, 0.1, 0.25, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    
    # Apple-style curves
    bezier = apple, 0.25, 0.1, 0, 1
    bezier = appleSwift, 0.55, 0.055, 0.675, 0.19
    
    # Custom fluid curves
    bezier = fluid, 0.05, 0.85, 0, 1
    bezier = snappy, 0.4, 0, 0.2, 1
    bezier = expo, 0.87, 0, 0.13, 1

    # ─────────────────────────────────────────────────────────────────────────
    # Window Animations
    # ─────────────────────────────────────────────────────────────────────────
    
    # Window open - smooth scale and fade
    animation = windowsIn, 1, 4, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    
    # Window movement - fluid motion
    animation = windowsMove, 1, 4, md3_standard, slide
    
    # ─────────────────────────────────────────────────────────────────────────
    # Fade Animations
    # ─────────────────────────────────────────────────────────────────────────
    
    animation = fadeIn, 1, 3, md3_decel
    animation = fadeOut, 1, 2, md3_accel
    animation = fadeSwitch, 1, 3, md3_standard
    animation = fadeShadow, 1, 3, md3_standard
    animation = fadeDim, 1, 4, md3_standard
    animation = fadeLayers, 1, 3, md3_decel
    
    # ─────────────────────────────────────────────────────────────────────────
    # Border Animations (for gradient borders)
    # ─────────────────────────────────────────────────────────────────────────
    
    animation = border, 1, 10, md3_standard
    animation = borderangle, 1, 100, linear, loop
    
    # ─────────────────────────────────────────────────────────────────────────
    # Workspace Animations
    # ─────────────────────────────────────────────────────────────────────────
    
    # Horizontal workspaces - smooth slide
    animation = workspaces, 1, 5, md3_decel, slide
    
    # Special workspace (scratchpad) - slide from top
    animation = specialWorkspace, 1, 4, md3_decel, slidefadevert -50%
    
    # ─────────────────────────────────────────────────────────────────────────
    # Layers (rofi, waybar popups, etc.)
    # ─────────────────────────────────────────────────────────────────────────
    
    animation = layers, 1, 3, md3_decel, popin 80%
}
