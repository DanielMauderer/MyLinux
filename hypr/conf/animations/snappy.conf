# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                     Hyprland Snappy Animations                            ║
# ║              Fast, responsive animations for productivity                 ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

animations {
    enabled = true

    # Snappy bezier curves
    bezier = snappy, 0.4, 0, 0.2, 1
    bezier = quick, 0.25, 0, 0.5, 1
    bezier = instant, 0.05, 0.7, 0.1, 1
    bezier = sharp, 0.5, 0, 0.1, 1

    # Window animations - quick and responsive
    animation = windowsIn, 1, 2, instant, popin 80%
    animation = windowsOut, 1, 2, sharp, popin 80%
    animation = windowsMove, 1, 2, snappy, slide

    # Fade animations - very quick
    animation = fadeIn, 1, 2, instant
    animation = fadeOut, 1, 1, sharp
    animation = fadeSwitch, 1, 2, snappy
    animation = fadeShadow, 1, 2, snappy
    animation = fadeDim, 1, 2, snappy
    animation = fadeLayers, 1, 2, instant

    # Border animations
    animation = border, 1, 5, snappy
    animation = borderangle, 1, 50, linear, loop

    # Workspace animations - instant feel
    animation = workspaces, 1, 3, instant, slide
    animation = specialWorkspace, 1, 2, instant, slidefadevert -60%

    # Layers
    animation = layers, 1, 2, instant, popin 90%
}
