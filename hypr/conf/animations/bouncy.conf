# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                     Hyprland Bouncy Animations                            ║
# ║                  Fun, playful animations with bounce                      ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

animations {
    enabled = true

    # Bouncy bezier curves
    bezier = bounce, 0.68, -0.55, 0.265, 1.55
    bezier = elastic, 0.28, 0.84, 0.42, 1.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.2
    bezier = wobbly, 0.4, 0, 0.2, 1.2
    bezier = spring, 0.22, 1, 0.36, 1

    # Window animations - bouncy entrance
    animation = windowsIn, 1, 5, bounce, popin 50%
    animation = windowsOut, 1, 4, elastic, popin 50%
    animation = windowsMove, 1, 4, overshot, slide

    # Fade animations
    animation = fadeIn, 1, 4, spring
    animation = fadeOut, 1, 3, elastic
    animation = fadeSwitch, 1, 4, spring
    animation = fadeShadow, 1, 4, spring
    animation = fadeDim, 1, 5, spring
    animation = fadeLayers, 1, 4, spring

    # Border animations
    animation = border, 1, 12, bounce
    animation = borderangle, 1, 80, linear, loop

    # Workspace animations - bouncy slide
    animation = workspaces, 1, 6, overshot, slide
    animation = specialWorkspace, 1, 5, bounce, slidefadevert -30%

    # Layers
    animation = layers, 1, 4, bounce, popin 70%
}
